<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Marketing Campaign Response Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        }

        .container{
            width:550px;
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            color:#dc3545;
            font-size:32px;
            margin-bottom:20px;
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#555;
            line-height:1.6;
            margin-bottom:15px;
        }

        .error-box{
            background:#fdecea;
            color:#721c24;
            border:2px solid #dc3545;
            padding:15px;
            border-radius:8px;
            margin:20px 0;
            font-weight:bold;
            word-wrap:break-word;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 25px;
            background:#007BFF;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">⚠️</div>

    <h1>Oops! Something Went Wrong</h1>

    <p>
        We couldn't process your request.
    </p>

    <div class="error-box">

        {{ error }}

    </div>

    <p>
        Please check your input values and try again.
    </p>

    <a href="/" class="btn">
        ⬅ Back to Home
    </a>

</div>

</body>
</html>
