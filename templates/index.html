<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Campaign Response Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9);
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{

            width:100%;
            max-width:950px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 40px rgba(0,0,0,.25);

        }

        h1{

            text-align:center;
            color:#0f172a;
            margin-bottom:10px;

        }

        p{

            text-align:center;
            color:#555;
            margin-bottom:35px;

        }

        form{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;

        }

        .full{

            grid-column:1/3;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;

        }

        input,select{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:15px;
            transition:.3s;

        }

        input:focus,
        select:focus{

            border-color:#2563eb;
            outline:none;
            box-shadow:0 0 8px rgba(37,99,235,.3);

        }

        button{

            width:100%;
            padding:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            background:#1d4ed8;
            transform:translateY(-2px);

        }

        @media(max-width:768px){

            form{

                grid-template-columns:1fr;

            }

            .full{

                grid-column:1;

            }

        }

    </style>

</head>

<body>

<div class="container">

<h1>📈 Marketing Campaign Response Prediction</h1>

<p>Fill in the customer details below to predict whether they are likely to respond to the marketing campaign.</p>

<form action="/predict" method="POST">

<div>
<label>Age</label>
<input type="number" name="Age" required>
</div>

<div>
<label>Income</label>
<input type="number" name="Income" required>
</div>

<div>
<label>Education</label>

<select name="Education">

<option value="Graduation">Graduation</option>
<option value="Master">Master</option>
<option value="PhD">PhD</option>

</select>

</div>

<div>
<label>Marital Status</label>

<select name="Marital_Status">

<option value="Single">Single</option>
<option value="Married">Married</option>
<option value="Together">Together</option>
<option value="Divorced">Divorced</option>

</select>

</div>

<div>
<label>Kid Home</label>
<input type="number" name="Kidhome" min="0" max="3">
</div>

<div>
<label>Teen Home</label>
<input type="number" name="Teenhome" min="0" max="3">
</div>

<div>
<label>Recency</label>
<input type="number" name="Recency">
</div>

<div>
<label>Total Spending</label>
<input type="number" name="Total_Spending">
</div>

<div class="full">

<button type="submit">

🚀 Predict Response

</button>

</div>

</form>

</div>

</body>

</html>
