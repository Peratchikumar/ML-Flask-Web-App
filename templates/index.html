<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marketing Campaign Response Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📈 Marketing Campaign Response Prediction</h1>

    <p>
        Enter the customer details below to predict whether the customer is
        likely to respond to the marketing campaign.
    </p>

    <form action="/predict" method="POST">

        <label>Age</label>
        <input
            type="number"
            name="Age"
            placeholder="Enter Age"
            required
        >

        <label>Income</label>
        <input
            type="number"
            name="Income"
            placeholder="Enter Income"
            required
        >

        <label>Recency</label>
        <input
            type="number"
            name="Recency"
            placeholder="Days Since Last Purchase"
            required
        >

        <label>Total Spending</label>
        <input
            type="number"
            name="Total_Spending"
            placeholder="Enter Total Spending"
            required
        >

        <label>Number of Web Purchases</label>
        <input
            type="number"
            name="NumWebPurchases"
            placeholder="Enter Web Purchases"
            required
        >

        <label>Number of Catalog Purchases</label>
        <input
            type="number"
            name="NumCatalogPurchases"
            placeholder="Enter Catalog Purchases"
            required
        >

        <label>Number of Store Purchases</label>
        <input
            type="number"
            name="NumStorePurchases"
            placeholder="Enter Store Purchases"
            required
        >

        <label>Education</label>

        <select name="Education" required>

            <option value="">Select Education</option>

            <option value="Basic">Basic</option>

            <option value="2n Cycle">2n Cycle</option>

            <option value="Graduation">Graduation</option>

            <option value="Master">Master</option>

            <option value="PhD">PhD</option>

        </select>

        <label>Marital Status</label>

        <select name="Marital_Status" required>

            <option value="">Select Marital Status</option>

            <option value="Single">Single</option>

            <option value="Married">Married</option>

            <option value="Together">Together</option>

            <option value="Divorced">Divorced</option>

            <option value="Widow">Widow</option>

            <option value="Alone">Alone</option>

            <option value="Absurd">Absurd</option>

            <option value="YOLO">YOLO</option>

        </select>

        <button type="submit">

            Predict Response

        </button>

        <button
            type="reset"
            style="margin-top:10px;background:#6c757d;">

            Reset

        </button>

    </form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
